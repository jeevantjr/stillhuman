<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital Health Informatics emblem — stethoscope, ECG, bar chart, open book, and human figure">
  <title>Digital Health Informatics Emblem</title>
  <desc>A professional emblem for Dr. T. Jeevaraj's digital health work, featuring a stethoscope, ECG heartbeat line, rising bar chart, open book, and a human figure — representing the intersection of medicine, data, and human life.</desc>

  <!-- White background circle -->
  <circle cx="200" cy="200" r="192" fill="white"/>

  <!-- Outer navy circle border (thick ring) -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="#1B3668" stroke-width="7"/>

  <!-- Inner teal arc (upper-right quarter) -->
  <path d="M 200 16 A 184 184 0 0 1 384 200" fill="none" stroke="#1ABED4" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ── HUMAN FIGURE (teal, centre-top) ── -->
  <!-- Head -->
  <circle cx="200" cy="83" r="17" fill="#1ABED4"/>
  <!-- Left arm (sweeping outward-up) -->
  <path d="M 188 108 C 172 102 148 95 112 100"
        fill="none" stroke="#1ABED4" stroke-width="12" stroke-linecap="round"/>
  <!-- Right arm (sweeping outward-up) -->
  <path d="M 212 108 C 228 102 252 95 288 100"
        fill="none" stroke="#1ABED4" stroke-width="12" stroke-linecap="round"/>
  <!-- Body (tapered teardrop) -->
  <path d="M 188 106 C 183 128 188 150 200 163 C 212 150 217 128 212 106 C 206 102 194 102 188 106 Z"
        fill="#1ABED4"/>

  <!-- ── ECG / HEARTBEAT LINE (red, upper-left) ── -->
  <line x1="32" y1="178" x2="60" y2="178" stroke="#E53935" stroke-width="3.5" stroke-linecap="round"/>
  <polyline points="60,178 76,150 90,208 105,128 120,178 148,178"
            fill="none" stroke="#E53935" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── STETHOSCOPE (navy, left side) ── -->
  <!-- Left earpiece tube -->
  <path d="M 98 208 C 94 192 88 183 80 178"
        fill="none" stroke="#1B3668" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right earpiece tube -->
  <path d="M 152 268 C 149 252 143 240 136 234"
        fill="none" stroke="#1B3668" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Main arch tube -->
  <path d="M 98 208 C 82 248 79 282 88 308 C 96 330 120 336 142 320 C 158 308 158 288 152 268"
        fill="none" stroke="#1B3668" stroke-width="5" stroke-linecap="round"/>
  <!-- Chest piece ring -->
  <circle cx="88" cy="316" r="19" fill="none" stroke="#1B3668" stroke-width="5"/>
  <!-- Chest piece centre dot -->
  <circle cx="88" cy="316" r="7" fill="#1B3668"/>

  <!-- ── BAR CHART (teal, right side) ── -->
  <rect x="224" y="248" width="23" height="48" rx="2" fill="#1ABED4" opacity="0.82"/>
  <rect x="254" y="218" width="23" height="78" rx="2" fill="#1ABED4"/>
  <rect x="284" y="186" width="23" height="110" rx="2" fill="#1ABED4"/>
  <rect x="314" y="150" width="23" height="146" rx="2" fill="#1ABED4" opacity="0.9"/>

  <!-- Trend line (navy) -->
  <polyline points="235.5,245 265.5,215 295.5,183 325.5,147"
            fill="none" stroke="#1B3668" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend line markers -->
  <circle cx="235.5" cy="245" r="5.5" fill="white" stroke="#1B3668" stroke-width="3"/>
  <circle cx="265.5" cy="215" r="5.5" fill="white" stroke="#1B3668" stroke-width="3"/>
  <circle cx="295.5" cy="183" r="5.5" fill="white" stroke="#1B3668" stroke-width="3"/>
  <circle cx="325.5" cy="147" r="7"   fill="white" stroke="#1B3668" stroke-width="3"/>

  <!-- ── OPEN BOOK (navy, bottom centre) ── -->
  <!-- Left page block -->
  <path d="M 98 346 C 98 326 138 316 198 319 L 198 374 C 138 371 98 378 98 358 Z" fill="#1B3668"/>
  <!-- Right page block -->
  <path d="M 302 346 C 302 326 262 316 202 319 L 202 374 C 262 371 302 378 302 358 Z" fill="#1B3668"/>
  <!-- Bottom curve of book -->
  <path d="M 98 358 C 98 370 138 382 200 380 C 262 382 302 370 302 358 L 302 358" fill="#1B3668"/>
  <!-- Spine highlight -->
  <line x1="200" y1="319" x2="200" y2="380" stroke="#2A4A8A" stroke-width="2.5"/>
  <!-- Left page lines -->
  <path d="M 106 336 C 108 326 138 322 196 324" fill="none" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <path d="M 108 347 C 110 337 140 333 197 335" fill="none" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <path d="M 110 358 C 112 348 141 344 197 346" fill="none" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <!-- Right page lines -->
  <path d="M 294 336 C 292 326 262 322 204 324" fill="none" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <path d="M 292 347 C 290 337 260 333 203 335" fill="none" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <path d="M 290 358 C 288 348 259 344 203 346" fill="none" stroke="white" stroke-width="1.5" opacity="0.32"/>

</svg>
